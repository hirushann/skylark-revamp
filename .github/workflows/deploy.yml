# Hostinger's build servers have a glibc too old for the Next.js compiler, so
# the site is built here and the finished files are pushed to the `hostinger`
# branch. Hostinger deploys that branch as an Express app (hostinger/server.js)
# that serves out/.
name: Build for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an older one
concurrency:
  group: build-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Assemble the prebuilt site
        run: |
          mkdir deploy
          cp -R out deploy/out
          cp hostinger/server.js hostinger/package.json deploy/
          cd deploy && npm install --package-lock-only --no-audit --no-fund

      - name: Push to the hostinger branch
        working-directory: deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger
